<mat-card class="house-card">
  <mat-card-content>
    <img
      mat-card-image
      src="https://material.angular.dev/assets/img/examples/shiba2.jpg"
      alt="Photo of a Shiba Inu"
    />
    {{title}}
    {{description}}
  </mat-card-content>

  <mat-card-actions>
    <button matButton>Learn more</button>
  </mat-card-actions>
</mat-card>
