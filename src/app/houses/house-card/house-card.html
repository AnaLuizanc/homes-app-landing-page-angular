<mat-card class="house-card">
  <mat-card-header>
    <img
      mat-card-image
      [src]="house().imageUrl"
    />
  </mat-card-header>

  <mat-card-content>
    <h3>{{ house().name }}</h3>
    <h4>{{ house().location }}</h4>
  </mat-card-content>

  <mat-card-actions>
    <button matButton (click)="openModal()">Learn more</button>
  </mat-card-actions>
</mat-card>

@if (isModalOpen()) {
  <app-house-modal [house]="house()" (close)="closeModal()" />
}
